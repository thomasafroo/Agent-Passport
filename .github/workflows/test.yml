name: Security invariants
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.lock -e ".[dev]"
      - run: python -m pytest -q
      - run: python scripts/benchmark.py
      - uses: actions/upload-artifact@v4
        with:
          name: measurements-${{ matrix.os }}-${{ matrix.python }}
          path: artifacts/benchmark.json

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.lock -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pyright

  rust-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown && rustup default stable
      - run: python -m pip install -r requirements.lock -e ".[dev]"
      - run: cargo test --locked
        working-directory: verifier-rs
      - run: cargo build --locked --target wasm32-unknown-unknown --lib
        working-directory: verifier-rs
      - run: python -m pytest -q tests/test_rust_verifier.py
        env:
          AGENT_PASSPORT_REQUIRE_RUST: "1"
